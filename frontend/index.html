<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal Contract Agent — Clear Contract Review</title>
    <meta
      name="description"
      content="Upload PDF, Word, or text contracts to read clauses in plain English, spot risky terms and deadlines, compare versions side by side, and ask questions with page references."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Legal Contract Agent — Clear Contract Review" />
    <meta
      property="og:description"
      content="Read every contract clearly before you sign: plain-English clause explanations, risk checks, side-by-side comparisons, drafting templates, and page-cited Q&amp;A."
    />
    <meta name="theme-color" content="#f7f6f2" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("lca_theme");
          if (t === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#111110");
          } else {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>

  </body>
</html>
