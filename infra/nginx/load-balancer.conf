# Edge Reverse Proxy & Load Balancer for Legal Contract Agent
# - Least-connections load balancing across stateless Express API replicas
# - Passive health checks and automatic upstream failover
# - Edge rate limiting, connection limiting, gzip compression, and security headers

limit_req_zone $binary_remote_addr zone=auth_edge:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_edge:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

upstream backend_api_pool {
    least_conn;
    server backend-1:5000 max_fails=3 fail_timeout=30s;
    server backend-2:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream frontend_static_pool {
    server frontend:80 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 12m;
    limit_conn addr_conn 40;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Baseline defense-in-depth HTTP security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Request-Id $request_id always;

    # Edge liveness probe for external load balancers
    location = /lb-health {
        access_log off;
        return 200 '{"status":"healthy","layer":"edge-nginx-lb"}';
        add_header Content-Type application/json;
    }

    # Strict rate-limited authentication routes
    location /api/auth/ {
        limit_req zone=auth_edge burst=12 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_api_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Load-balanced API routes (contracts, extraction, grounded Q&A, analytics)
    location /api/ {
        limit_req zone=api_edge burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_api_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Backend health probe pass-through
    location = /health {
        proxy_pass http://backend_api_pool/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $request_id;
    }

    # SPA static assets
    location / {
        proxy_pass http://frontend_static_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
