x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    - NODE_ENV=production
    - PORT=5000
    - AI_SERVICE_URLS=http://ai-service:8000
    - REDIS_URL=redis://redis:6379
    - INTERNAL_API_KEY=${INTERNAL_API_KEY:-change-me-in-production-internal-key}
    - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  volumes:
    - contract_uploads:/app/uploads
  depends_on:
    redis:
      condition: service_healthy
    ai-service:
      condition: service_healthy
  networks:
    - edge_net
    - internal_net
  restart: unless-stopped

services:
  # Shared Redis store for distributed rate limiting & caching across backend replicas
  redis:
    image: redis:7-alpine
    container_name: legal-contract-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal_net
    restart: unless-stopped

  # Optional external Qdrant vector database for multi-replica AI workers (--profile qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-contract-qdrant
    profiles: ["qdrant"]
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal_net
    restart: unless-stopped

  # Internal-only AI microservice (never published on public host ports)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: legal-contract-ai
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      - APP_ENV=production
      - PORT=8000
      - VECTOR_STORE_PROVIDER=${VECTOR_STORE_PROVIDER:-chroma}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-change-me-in-production-internal-key}
      - CORS_ORIGINS=http://backend-1:5000,http://backend-2:5000
    volumes:
      - chroma_data:/app/chroma_db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal_net
    restart: unless-stopped

  # Horizontally load-balanced Express API Gateway replicas
  backend-1:
    <<: *backend-common
    container_name: legal-contract-backend-1

  backend-2:
    <<: *backend-common
    container_name: legal-contract-backend-2

  # Static React SPA container behind the Nginx Edge Load Balancer
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: legal-contract-frontend
    networks:
      - edge_net
    restart: unless-stopped

  # Public Edge Reverse Proxy & Load Balancer (least_conn + passive health checks + rate limiting)
  edge-lb:
    image: nginx:1.27-alpine
    container_name: legal-contract-edge-lb
    ports:
      - "5173:80"
    volumes:
      - ./infra/nginx/load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/lb-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - edge_net
    restart: unless-stopped

networks:
  edge_net:
    driver: bridge
  # Non-published private bridge network: services on internal_net have no host ports
  # exposed publicly, while ai-service retains outbound HTTPS access for Gemini & Qdrant Cloud.
  internal_net:
    driver: bridge

volumes:
  chroma_data:
  qdrant_data:
  contract_uploads:
