services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: legal-contract-ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - chroma_data:/app/chroma_db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-contract-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - AI_SERVICE_URL=http://ai-service:8000
    volumes:
      - contract_uploads:/app/uploads
    depends_on:
      ai-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: legal-contract-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  chroma_data:
  contract_uploads:
