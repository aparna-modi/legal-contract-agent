services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: legal-contract-ai
    ports:
      - "8000:8000"
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      - PORT=8000
    volumes:
      - chroma_data:/app/chroma_db
      - contract_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-contract-backend
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
    volumes:
      - contract_uploads:/app/uploads
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: legal-contract-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
  contract_uploads:
