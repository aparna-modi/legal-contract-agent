services:
  ai-service:
    build:
      context: ./ai-service
    container_name: legal-agent-ai
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    volumes:
      - chroma_data:/app/chroma_db
      - contract_uploads:/app/uploads
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: legal-agent-api
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
    volumes:
      - contract_uploads:/app/uploads
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: legal-agent-web
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
  contract_uploads:
